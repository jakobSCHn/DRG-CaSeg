preprocessing:
  - id: "scaling"
    function: data_utils.wrangler.scale_video
    params:
      min_intensity: 0
      max_intensity: 255 
  - id: "normalization"
    function: data_utils.wrangler.norm_video
  - id: "motion_correction"
    function: data_utils.wrangler.correct_motion

analysis:
  - id: "caiman_default"
    function: analysis_utils.caiman.run_cnmfe
    export_matrices: True
  - id: "ica_mukamel_n_40"
    function: analysis_utils.workflow.run_ica
    export_matrices: True
    params:
      mu: 0.5
      n_pcs: 40
  - id: "ica_mukamel_n_120"
    function: analysis_utils.workflow.run_ica
    export_matrices: True
    params:
      mu: 0.5
      n_pcs: 120
  

visualization:
