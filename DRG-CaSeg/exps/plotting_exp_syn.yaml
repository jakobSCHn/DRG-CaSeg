experiment_name: "plotting_exp_syn"

dataset:
  - id: "syn_27"
    loader: data_utils.wrangler.load_drg_model_video
    seed: 27
    params:
      fps: 30
      duration_s: 500
      full_well_capacity: 15000
  - id: "syn_79"
    loader: data_utils.wrangler.load_drg_model_video
    seed: 79
    params:
      fps: 30
      duration_s: 500
      full_well_capacity: 15000
  - id: "syn_34"
    loader: data_utils.wrangler.load_drg_model_video
    seed: 34
    params:
      fps: 30
      duration_s: 500
      full_well_capacity: 15000

preprocessing:
  - id: "scaling"
    function: data_utils.wrangler.scale_video
    params:
      min_intensity: 0
      max_intensity: 255 
  - id: "normalization"
    function: data_utils.wrangler.norm_video

analysis:
  - id: "caiman_default"
    function: analysis_utils.caiman.run_cnmfe
    export_matrices: True
  - id: "ica_mukamel_n_40"
    function: analysis_utils.workflow.run_ica
    export_matrices: True
    params:
      mu: 0.5
      n_pcs: 40
  - id: "ica_mukamel_n_120"
    function: analysis_utils.workflow.run_ica
    export_matrices: True
    params:
      mu: 0.5
      n_pcs: 120

visualization:
  - id: "ground_truth_plot"
    function: data_utils.plot_adapters.plot_adapter_gt_summary
  - id: "prediction_plot"
    function: data_utils.plot_adapters.plot_adapter_prediction_summary
    

evaluation:
  - id: "iou_score"
    function: analysis_utils.workflow.evaluate_model_performance
    params:
      iou_threshold: 0.5