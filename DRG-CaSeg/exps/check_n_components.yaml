preprocessing:
  - id: "scaling"
    function: data_utils.wrangler.scale_video
    params:
      min_intensity: 0
      max_intensity: 255 
  - id: "normalization"
    function: data_utils.wrangler.norm_video

analysis:
  - id: "ica_mukamel_n_40"
    function: analysis_utils.workflow.run_ica
    params:
      mu: 0.5
      n_pcs: 40
  - id: "ica_mukamel_n_60"
    function: analysis_utils.workflow.run_ica
    params:
      mu: 0.5
      n_pcs: 60
  - id: "ica_mukamel_n_80"
    function: analysis_utils.workflow.run_ica
    params:
      mu: 0.5
      n_pcs: 80
  - id: "ica_mukamel_n_100"
