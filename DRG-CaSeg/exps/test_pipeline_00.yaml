experiment_name: "test_pipeline_00"

dataset:
  - id: "syn"
    loader: data_utils.wrangler.load_drg_model_video
    params:
      fps: 30
      duration_s: 20
      full_well_capacity: 15000
  - id: "cut_test_vid"
    loader: data_utils.wrangler.load_czi_to_caiman
    params:
      filename: "/home/jaschneider/projects/DRG-CaSeg/data/test_00_3rdB2.czi"
  
preprocessing:
  - id: "motion_correction"
    function: data_utils.wrangler.correct_motion
  - id: "scaling"
    function: data_utils.wrangler.scale_video
    params:
      min_intensity: 0
      max_intensity: 255 
  - id: "normalization"
    function: data_utils.wrangler.norm_video


analysis:
  - id: "ica_mukamel"
    function: analysis_utils.workflow.run_ica
    export_matrices: True
    params:
      mu: 0.5

postprocessing:
  - id: "discard_background"
    function: postprocessing.processing_adapters.filter_background_masks
  - id: "filter_traces"
    function: postprocessing.processing_adapters.bandpass_filter_traces
  

visualization:
  - id: "prediction_plot"
    function: data_utils.plot_adapters.plot_adapter_prediction_summary
  
  