preprocessing:
  - id: "scaling"
    function: data_utils.wrangler.scale_video
    params:
      min_intensity: 0
      max_intensity: 255
  - id: "normalization"
    function: data_utils.wrangler.norm_video
  - id: "motion_correction"
    function: data_utils.wrangler.correct_motion
  

analysis:
  - id: "ica_mukamel_0.2"
    function: analysis_utils.workflow.run_ica
    params:
      mu: 0.0
      n_pcs: 40
  - id: "ica_mukamel_0.5"
    function: analysis_utils.workflow.run_ica
    params:
      mu: 1.0
      n_pcs: 40
  - id: "ica_mukamel_0.8"
    function: analysis_utils.workflow.run_ica
    params:
      mu: 0.8
      n_pcs: 50

visualization:
  - id: "ground_truth_plot"
    function: data_utils.plot_adapters.plot_adapter_gt_summary
  - id: "prediction_plot"
    function: data_utils.plot_adapters.plot_adapter_prediction_summary

evaluation:
  - id: "iou_score"
    function: analysis_utils.workflow.evaluate_model_performance
    params:
      iou_threshold: 0.5
  